name: Atualizar dados do monitoramento parlamentar

on:
  schedule:
    # 05:00 Brasilia (UTC-3) = 08:00 UTC -> atualizacao diaria de dados
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest
    concurrency:
      group: atualizar-monitoramento-parlamentar
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements-dev.txt

      - name: Baixar planilha do SharePoint
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: python -m src.clientes.sharepoint

      - name: Executar notebook
        # Execucao normal leva ~3 min. O teto evita que um dia de instabilidade
        # nas APIs (Camara/Senado) gere uma tempestade de retries que rode ate o
        # limite de 6h do runner. Se estourar, o job falha rapido e tenta no proximo cron.
        timeout-minutes: 30
        run: |
          papermill tratar_dados_v2.ipynb tratar_dados_v2_saida.ipynb

      - name: Commitar arquivos alterados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Atualiza dados automaticamente"

      - name: Enviar alteracoes
        run: |
          git push

  manter-acordado:
    # Roda nos crons de keep-warm (06:15 e 12:30 Brasilia) para acordar o app
    if: github.event.schedule == '15 9 * * *' || github.event.schedule == '30 15 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Ping no app Streamlit (acordar)
        run: |
          URL="https://monitora-parlamentar-seges-v2.streamlit.app/"
          echo "Acordando o app: $URL"
          # Tres requisicoes espacadas dao tempo do container subir do "sono"
          for i in 1 2 3; do
            code=$(curl -sS -L --max-time 90 -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Tentativa $i -> HTTP $code"
            sleep 20
          done
